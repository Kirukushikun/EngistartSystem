<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EngiStart – Project Timeline Calendar</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#eeede9;
  --text:#1c1c1a;--text2:#6b6b67;--text3:#a0a09b;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --blue-bg:#e8f0fb;--blue:#1a4fa0;--blue-bd:rgba(26,79,160,0.22);
  --green-bg:#e8f5ee;--green:#1a6e3a;--green-bd:rgba(26,110,58,0.22);
  --red-bg:#fdeaea;--red:#a32020;--red-bd:rgba(163,32,32,0.22);
  --amber-bg:#fef3e2;--amber:#7a4f00;--amber-bd:rgba(122,79,0,0.22);
  --violet-bg:#f1edfb;--violet:#5b3fa0;--violet-bd:rgba(91,63,160,0.22);
  --gray-bg:#f2f1ef;--gray:#5a5a56;
  --r:8px;--rl:12px;
}
body[data-theme='dark']{
  --bg:#12161d;--bg2:#1a2029;--bg3:#0d1117;
  --text:#edf2f7;--text2:#a9b4c2;--text3:#748091;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
  --blue-bg:#13243b;--blue:#8ab4f8;--blue-bd:rgba(138,180,248,0.28);
  --green-bg:#11281d;--green:#7bd79a;--green-bd:rgba(123,215,154,0.28);
  --red-bg:#35161a;--red:#ff9c9c;--red-bd:rgba(255,156,156,0.28);
  --amber-bg:#352611;--amber:#f6c66f;--amber-bd:rgba(246,198,111,0.28);
  --violet-bg:#241c38;--violet:#c3b0f5;--violet-bd:rgba(195,176,245,0.28);
  --gray-bg:#202734;--gray:#c2cad6;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;color:var(--text);background:var(--bg3);transition:background .2s,color .2s}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

.app{max-width:1180px;margin:0 auto;padding:22px 20px 40px}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:0 0 4px}
h1{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
.scope-note{font-size:12px;color:var(--text2);margin-top:4px}

.roles{display:flex;gap:4px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rl);padding:3px}
.roles button{appearance:none;border:0;background:transparent;color:var(--text2);font-size:12px;font-family:inherit;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
.roles button:hover{color:var(--text)}
.roles button.active{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.roles button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.board{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:1fr}}

.panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden}

.gantt-scroll{overflow-x:auto}
.gantt{min-width:920px}

.ruler{display:flex;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.ruler .rlabel{width:44px;flex:0 0 44px;padding:9px 10px;font-size:11px;color:var(--text3);border-right:0.5px solid var(--border)}
.ruler .month{flex:0 0 var(--mw);padding:9px 0;font-size:11px;color:var(--text2);text-align:center;border-right:0.5px solid var(--border)}
.ruler .month:last-child{border-right:0}

.rows{position:relative}
.farmgroup + .farmgroup{border-top:0.5px solid var(--border)}
.farmhead{display:flex}
.farmhead .rlabel{width:44px;flex:0 0 44px;border-right:0.5px solid var(--border)}
.farmhead .flabel{padding:8px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text3);text-transform:uppercase}

.row{display:flex;align-items:stretch;min-height:46px}
.row .rlabel{width:44px;flex:0 0 44px;border-right:0.5px solid var(--border)}
.row .track{position:relative;flex:1;border-right:none}
.row + .row{border-top:0.5px solid var(--border)}

.grid-cols{position:absolute;inset:0;display:flex;pointer-events:none}
.grid-cols span{flex:0 0 var(--mw);border-right:0.5px dashed var(--border)}

.bar{position:absolute;top:9px;bottom:9px;border-radius:7px;border:0.5px solid;padding:0 9px;display:flex;align-items:center;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:filter .1s,box-shadow .1s}
.bar:hover{filter:brightness(1.03);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.bar.selected{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}

.today-line{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--red);z-index:1}
.today-tag{position:absolute;top:-1px;transform:translate(-50%,-100%);font-size:9.5px;font-weight:600;color:var(--red);background:var(--red-bg);border:0.5px solid var(--red-bd);border-radius:5px;padding:1px 5px;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:14px;padding:11px 16px;border-top:0.5px solid var(--border);background:var(--bg2)}
.legend .item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend .swatch{width:10px;height:10px;border-radius:3px;border:0.5px solid}

.detail{padding:16px;position:sticky;top:16px}
.detail-empty{color:var(--text3);font-size:12px;line-height:1.7;padding:8px 2px}
.detail-id{font-size:11px;color:var(--text3);margin-bottom:3px}
.detail-title{font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:10px;text-wrap:balance}
.dl{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.dl .row2{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.dl .k{color:var(--text2)}
.dl .v{font-weight:500;text-align:right}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;border:0.5px solid}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;border:0.5px solid;background:var(--violet-bg);color:var(--violet);border-color:var(--violet-bd)}
.detail hr{border:0;border-top:0.5px solid var(--border);margin:12px 0}
.detail .foot{font-size:11px;color:var(--text3);line-height:1.6}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <p class="eyebrow">EngiStart · Prototype</p>
      <h1>Project Timeline Calendar</h1>
      <p class="scope-note" id="scopeNote"></p>
    </div>
    <div class="roles" id="roleTabs" role="tablist" aria-label="View as role"></div>
  </div>

  <div class="board">
    <div class="panel">
      <div class="gantt-scroll">
        <div class="gantt" id="gantt"></div>
      </div>
      <div class="legend">
        <div class="item"><span class="swatch" style="background:var(--blue-bg);border-color:var(--blue-bd)"></span>In review</div>
        <div class="item"><span class="swatch" style="background:var(--green-bg);border-color:var(--green-bd)"></span>Accepted</div>
        <div class="item"><span class="swatch" style="background:var(--amber-bg);border-color:var(--amber-bd)"></span>Late filing / JL</div>
        <div class="item"><span class="swatch" style="background:var(--red-bg);border-color:var(--red-bd)"></span>Rejected</div>
        <div class="item"><span class="swatch" style="background:var(--violet-bg);border-color:var(--violet-bd)"></span>Category chip (budget size)</div>
        <div class="item"><span style="width:10px;border-top:1.5px solid var(--red);display:inline-block"></span>Today</div>
      </div>
    </div>

    <div class="panel detail" id="detail"></div>
  </div>
</div>

<script>
const TODAY = new Date('2026-07-30');
const RANGE_START = new Date('2026-06-01');
const RANGE_END = new Date('2026-12-15');
const MONTHS = ['Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_W = 118;
const dayDiff = (a,b) => Math.round((b-a)/86400000);
const totalDays = dayDiff(RANGE_START, RANGE_END);
const pxPerDay = (MONTHS.length * MONTH_W) / totalDays;
const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

const STATUS = {
  in_review:  {label:'In Review',  bg:'var(--blue-bg)',  fg:'var(--blue)',  bd:'var(--blue-bd)'},
  accepted:   {label:'Accepted',   bg:'var(--green-bg)', fg:'var(--green)', bd:'var(--green-bd)'},
  late:       {label:'Late Filing / JL', bg:'var(--amber-bg)', fg:'var(--amber)', bd:'var(--amber-bd)'},
  rejected:   {label:'Rejected',   bg:'var(--red-bg)',   fg:'var(--red)',   bd:'var(--red-bd)'},
};
const CATEGORY = {small:'Small', medium:'Medium', large:'Large'};

const PROJECTS = [
  {id:'APIS-2026-088', farm:'Farm A – Bamban, Tarlac', title:'Equipment Shed', by:'Jose Santos', role:'farm_manager', engineer:'Engr. L. Bautista', category:'medium', status:'rejected', submitted:'2026-06-01', start:'2026-07-15', completion:'2026-10-23', purpose:'Secondary shed for tractors and implements.'},
  {id:'APIS-2026-090', farm:'Farm C – Concepcion, Tarlac', title:'Feed Storage Expansion', by:'Pedro Reyes', role:'farm_manager', engineer:'Engr. R. Ramos', category:'large', status:'in_review', submitted:'2026-05-04', start:'2026-07-06', completion:'2026-11-30', purpose:'500 sqm feed warehouse adjacent to existing facility.'},
  {id:'APIS-2026-095', farm:'Farm B – Capas, Tarlac', title:'Irrigation Pump Upgrade', by:'Maria Cruz', role:'farm_manager', engineer:'Engr. R. Ramos', category:'small', status:'in_review', submitted:'2026-07-01', start:'2026-08-12', completion:'2026-10-14', purpose:'Replace aging main irrigation pump before dry season.'},
  {id:'APIS-2026-098', farm:'Farm A – Bamban, Tarlac', title:'Feed Line Automation', by:'Jose Santos', role:'farm_manager', engineer:'Engr. L. Bautista', category:'medium', status:'accepted', submitted:'2026-06-15', start:'2026-08-19', completion:'2026-11-27', purpose:'Automated feed distribution line for Building 2.'},
  {id:'APIS-2026-101', farm:'Farm A – Bamban, Tarlac', title:'Poultry House Renovation', by:'Jose Santos', role:'farm_manager', engineer:'Engr. L. Bautista', category:'small', status:'in_review', submitted:'2026-07-30', start:'2026-09-09', completion:'2026-11-10', purpose:'Roof, ventilation, and lighting upgrades for Building 3.'},
  {id:'APIS-2026-102', farm:'Farm D – Angeles, Pampanga', title:'Biogas Plant Repair', by:'Ramon Torres', role:'farm_manager', engineer:'Engr. R. Ramos', category:'small', status:'late', submitted:'2026-07-20', start:'2026-08-31', completion:'2026-11-02', purpose:'Urgent repair of biogas unit 2 — filed under the late-filing track.'},
];

const ROLES = [
  {key:'farm_manager', label:'Farm Manager', person:'Jose Santos', scope:'Showing requests you submitted for Farm A – Bamban, Tarlac.', filter:p => p.by === 'Jose Santos'},
  {key:'engineer', label:'Engineer', person:'Engr. R. Ramos', scope:'Showing projects assigned to you across all farms.', filter:p => p.engineer === 'Engr. R. Ramos'},
  {key:'division_head', label:'Division Head', person:'Div. Head Santos', scope:'Showing every request awaiting or under your review, across all farms.', filter:() => true},
  {key:'it_admin', label:'IT Admin', person:'Jeff Montiano', scope:'Read-only oversight view of every request in the system.', filter:() => true},
];

let activeRole = ROLES[0];
let selectedId = null;

function xFor(dateStr){
  const d = new Date(dateStr);
  return Math.max(0, dayDiff(RANGE_START, d)) * pxPerDay;
}
function widthFor(startStr, endStr){
  return Math.max(6, dayDiff(new Date(startStr), new Date(endStr)) * pxPerDay);
}

function renderTabs(){
  const el = document.getElementById('roleTabs');
  el.innerHTML = '';
  ROLES.forEach(r => {
    const b = document.createElement('button');
    b.textContent = r.label;
    b.type = 'button';
    b.role = 'tab';
    b.setAttribute('aria-selected', r.key === activeRole.key);
    if (r.key === activeRole.key) b.classList.add('active');
    b.onclick = () => { activeRole = r; selectedId = null; renderAll(); };
    el.appendChild(b);
  });
}

function renderGantt(){
  const visible = PROJECTS.filter(activeRole.filter);
  const farms = [...new Set(visible.map(p => p.farm))];
  const totalW = MONTHS.length * MONTH_W;
  const todayX = xFor(TODAY.toISOString().slice(0,10));

  let html = `<div class="ruler" style="width:${totalW + 44}px">
    <div class="rlabel"></div>
    ${MONTHS.map(m => `<div class="month" style="--mw:${MONTH_W}px">${m} 2026</div>`).join('')}
  </div>`;

  html += `<div class="rows" style="width:${totalW + 44}px">`;
  farms.forEach(farm => {
    const rows = visible.filter(p => p.farm === farm);
    html += `<div class="farmgroup">
      <div class="farmhead"><div class="rlabel"></div><div class="flabel">${farm}</div></div>`;
    rows.forEach(p => {
      const st = STATUS[p.status];
      const left = xFor(p.start);
      const width = widthFor(p.start, p.completion);
      html += `<div class="row">
        <div class="rlabel"></div>
        <div class="track">
          <div class="grid-cols">${MONTHS.map(() => `<span style="--mw:${MONTH_W}px"></span>`).join('')}</div>
          <div class="bar${p.id === selectedId ? ' selected' : ''}" tabindex="0"
               style="left:${left}px;width:${width}px;background:${st.bg};color:${st.fg};border-color:${st.bd}"
               data-id="${p.id}" title="${p.title} — ${fmt(new Date(p.start))} to ${fmt(new Date(p.completion))}">
            ${p.title}
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `<div class="today-line" style="left:${todayX + 44}px">
    <div class="today-tag">Today · Jul 30</div>
  </div>`;
  html += `</div>`;

  if (!visible.length){
    html = `<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:12px">No projects in this view yet.</div>`;
  }

  document.getElementById('gantt').innerHTML = html;
  document.querySelectorAll('.bar').forEach(b => {
    b.onclick = () => { selectedId = b.dataset.id; renderAll(); };
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectedId = b.dataset.id; renderAll(); } };
  });
}

function renderDetail(){
  const el = document.getElementById('detail');
  const p = PROJECTS.find(x => x.id === selectedId);
  if (!p){
    el.innerHTML = `<div class="detail-empty">Select a project bar on the timeline to see its full request details here — dates, category, assigned engineer, and status.</div>`;
    return;
  }
  const st = STATUS[p.status];
  el.innerHTML = `
    <div class="detail-id mono">${p.id}</div>
    <div class="detail-title">${p.title}</div>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <span class="pill" style="background:${st.bg};color:${st.fg};border-color:${st.bd}">${st.label}</span>
      <span class="chip">${CATEGORY[p.category]}</span>
    </div>
    <div class="dl">
      <div class="row2"><span class="k">Farm</span><span class="v">${p.farm}</span></div>
      <div class="row2"><span class="k">Submitted by</span><span class="v">${p.by}</span></div>
      <div class="row2"><span class="k">Assigned engineer</span><span class="v">${p.engineer}</span></div>
    </div>
    <hr>
    <div class="dl">
      <div class="row2"><span class="k">Date submitted</span><span class="v mono">${fmt(new Date(p.submitted))}</span></div>
      <div class="row2"><span class="k">Project start</span><span class="v mono">${fmt(new Date(p.start))}</span></div>
      <div class="row2"><span class="k">Completion</span><span class="v mono">${fmt(new Date(p.completion))}</span></div>
    </div>
    <hr>
    <p class="foot">${p.purpose}</p>
  `;
}

function renderAll(){
  renderTabs();
  document.getElementById('scopeNote').textContent = `${activeRole.person} · ${activeRole.scope}`;
  renderGantt();
  renderDetail();
}
renderAll();
</script>
</body>
</html>
